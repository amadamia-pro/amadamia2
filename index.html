<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>Amadamia2 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#a78bfa;--accent-light:#f1ecff;--accent-dark:#8b6ef0;
  --accent-pink:#ffb3d1;--accent-pink-lt:#ffe5ee;
  --accent-sky:#bcdfff;--accent-sky-lt:#e6f2ff;
  --accent-mint:#b8f0d4;--accent-mint-lt:#e4faed;
  --bg:#f7f7fb;--bg-card:#fff;--bg-soft:#f2f2f7;
  --text-1:#1d1b2e;--text-2:#6b7280;--text-3:#9ca3af;
  --border:rgba(29,27,46,.08);--border-soft:rgba(29,27,46,.05);
  --danger:#ff5d7a;--danger-light:#ffe4ea;
  --success:#3ccb8a;--success-light:#dcf7e8;
  --warning:#ffb84d;
  --shadow-xs:0 1px 2px rgba(17,12,46,.04);
  --shadow-sm:0 2px 8px rgba(17,12,46,.05);
  --shadow-md:0 6px 18px rgba(17,12,46,.07);
  --shadow-lg:0 14px 36px rgba(17,12,46,.10);
  --shadow-xl:0 24px 56px rgba(17,12,46,.14);
  --shadow-primary:0 10px 24px rgba(167,139,250,.35);
  --glass-bg:rgba(255,255,255,.72);--glass-border:rgba(29,27,46,.06);
  --glass-blur:saturate(1.6) blur(18px);
  --radius-sm:12px;--radius:18px;--radius-lg:24px;--radius-xl:28px;--radius-full:999px;
  --sidebar-w:224px;--t:.22s cubic-bezier(.4,0,.2,1);--t-s:.14s cubic-bezier(.4,0,.2,1);
  --hairline:rgba(29,27,46,.07);
  --holo:linear-gradient(120deg,#ffe5ee 0%,#f1ecff 25%,#e6f2ff 50%,#e4faed 75%,#fff0f6 100%);
}
html{font-size:15px}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text-1);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 14% 10%,rgba(167,139,250,.16) 0,transparent 38%),
    radial-gradient(circle at 92% 88%,rgba(255,179,209,.14) 0,transparent 38%),
    radial-gradient(circle at 70% 14%,rgba(188,223,255,.13) 0,transparent 42%),
    radial-gradient(circle at 18% 82%,rgba(184,240,212,.12) 0,transparent 40%),
    linear-gradient(135deg,#fdf4ff 0%,#eef2ff 48%,#f0fdfa 100%);
  background-attachment:fixed;overflow-x:hidden;}
body::before{content:'';position:fixed;width:420px;height:420px;top:-120px;left:-100px;border-radius:50%;filter:blur(60px);opacity:.4;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(167,139,250,.55) 0%,transparent 70%);animation:float-slow 14s ease-in-out infinite;}
body::after{content:'';position:fixed;width:380px;height:380px;bottom:-140px;right:-120px;border-radius:50%;filter:blur(60px);opacity:.4;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,179,209,.48) 0%,transparent 70%);animation:float-slow 17s ease-in-out infinite reverse;}
body>*{position:relative;z-index:1}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.028em;line-height:1.1;font-weight:700}
@keyframes float-slow{0%,100%{transform:translate(0,0)}33%{transform:translate(8px,-12px)}66%{transform:translate(-6px,6px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.2) rotate(12deg)}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-glow{0%,100%{box-shadow:var(--shadow-primary)}50%{box-shadow:0 14px 32px rgba(167,139,250,.5)}}
.app-layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:rgba(255,255,255,.78);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  display:flex;flex-direction:column;position:sticky;top:0;align-self:start;height:100vh;z-index:100;border-right:1px solid var(--glass-border)}
.sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);position:relative}
.sidebar-brand::after{content:'\2733';position:absolute;top:20px;right:20px;color:var(--accent-pink);font-size:1.05rem}
.sidebar-brand h2{color:var(--text-1);font-size:1.1rem;font-weight:700}
.brand-sub{color:var(--text-2);font-size:.62rem;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:2px}
.sidebar-nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-section{display:block;padding:16px 16px 6px;font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);user-select:none;pointer-events:none}
.nav-section:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text-2);transition:all var(--t);border:none;background:none;width:100%;text-align:left;margin-bottom:2px;font-family:inherit;position:relative}
.nav-item:hover{background:var(--accent-light);color:var(--text-1)}
.nav-item.active{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#fff;box-shadow:var(--shadow-primary)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:4px;background:var(--accent)}
.nav-item i{width:20px;text-align:center;font-size:.95rem;flex-shrink:0}
.nav-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);font-size:.65rem;color:var(--text-3);font-family:'JetBrains Mono',monospace;
  background:linear-gradient(180deg,transparent,rgba(241,236,255,.25))}
.sidebar-footer::before{content:'\2736  \2736  \2736';display:block;text-align:center;color:var(--accent);opacity:.25;letter-spacing:1em;font-size:.55rem;margin-bottom:6px}
.user-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-full);background:var(--bg-soft);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;transition:all var(--t)}
.user-pill:hover{background:var(--accent-light)}
.user-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-badge{padding:2px 8px;border-radius:var(--radius-full);font-size:.58rem;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.role-admin{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.role-emp{background:var(--success-light);color:#0a6640;border:1px solid rgba(60,203,138,.25)}
.main-area{min-width:0;min-height:100vh;display:flex;flex-direction:column;background:rgba(255,255,255,.55)}
.topbar{background:var(--glass-bg);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);
  border-bottom:1px solid var(--glass-border);padding:10px 24px;display:flex;align-items:center;gap:16px;min-height:54px;position:sticky;top:0;z-index:50}
.topbar::before{content:'\2736';position:absolute;top:10px;right:18px;font-size:.85rem;color:var(--accent);opacity:.45;animation:twinkle 4.2s ease-in-out infinite;pointer-events:none}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:1.08rem;font-weight:700;flex:1;letter-spacing:-.022em}
.store-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:var(--radius-full);background:var(--bg-soft);border:1px solid var(--border);font-size:.8rem;font-weight:600;color:var(--text-2)}
.store-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main-content{flex:1;padding:24px 28px 32px;animation:viewIn .32s cubic-bezier(.4,0,.2,1);min-width:0;overflow-x:hidden;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius-full);
  background:var(--bg-card);color:var(--text-1);font-size:.84rem;font-weight:600;cursor:pointer;transition:all var(--t);font-family:inherit;box-shadow:var(--shadow-xs)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#b89dfa,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.btn-primary:hover{animation:pulse-glow 2s ease-in-out infinite}
.btn-danger{color:#fff;background:linear-gradient(135deg,#ff7d94,var(--danger),#e74667);border-color:transparent}
.btn-sm{padding:7px 14px;font-size:.78rem}
.icon-btn{background:none;border:1px solid transparent;cursor:pointer;color:var(--text-2);padding:7px 10px;border-radius:10px;transition:all var(--t-s);font-size:.9rem}
.icon-btn:hover{background:var(--bg-soft)}
.icon-btn.danger:hover{color:#fff;background:var(--danger)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 28px;box-shadow:var(--shadow-sm);transition:all var(--t)}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.store-card{background:var(--bg-card);border:1px solid var(--border);border-top:5px solid var(--sc,var(--accent));border-radius:var(--radius-lg);padding:24px 22px;cursor:pointer;transition:all var(--t);position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.store-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.store-dot{width:14px;height:14px;border-radius:50%;background:var(--sc,var(--accent));margin-bottom:12px}
.store-name{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.store-loc{font-size:.8rem;color:var(--text-2);margin-bottom:16px;font-family:'JetBrains Mono',monospace}
.store-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skpi{background:var(--bg-soft);border-radius:12px;padding:10px 12px}
.skpi-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.skpi-val{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700}
.kpi-grid-hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:18px}
.kpi-hero{background:linear-gradient(135deg,#1d1b2e,#2d2a46);color:#fff;border-radius:var(--radius-xl);padding:28px 30px;position:relative;overflow:hidden;box-shadow:0 14px 36px rgba(29,27,46,.22);transition:all var(--t)}
.kpi-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.5}
.kpi-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--kc,var(--accent))}
.kpi-hero:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(29,27,46,.3)}
.kh-icon{background:rgba(255,255,255,.14);color:#fff;width:42px;height:42px;font-size:1.05rem;position:absolute;top:22px;right:22px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kh-lbl{color:rgba(255,255,255,.6);font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;position:relative}
.kh-val{color:#fff;font-size:2rem;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.03em;position:relative}
.kh-sub{font-size:.74rem;color:rgba(255,255,255,.5);margin-top:4px;font-family:'JetBrains Mono',monospace;position:relative}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm);transition:all var(--t);position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--accent));opacity:.7}
.kc-icon{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--accent-light);color:var(--accent-dark)}
.kc-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2);margin-bottom:7px;font-family:'JetBrains Mono',monospace}
.kc-val{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:700;color:var(--text-1);letter-spacing:-.03em}
.sec-title{font-size:1.05rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;letter-spacing:-.022em}
.sec-title::after{content:' \2736';font-size:.75em;color:var(--accent);opacity:.55;vertical-align:super}
.dx-header{border-bottom:1px solid var(--hairline);padding-bottom:18px;margin-bottom:24px;position:relative}
.dx-header::after{content:'';position:absolute;bottom:-1px;left:0;width:56px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-pink));border-radius:2px}
.dx-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);display:inline-flex;align-items:center;gap:8px;margin-bottom:6px}
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
thead{background:rgba(252,250,255,.6)}
th{padding:12px 16px;text-align:left;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr{transition:background var(--t)}
tbody tr:hover{background:linear-gradient(90deg,rgba(241,236,255,.5),rgba(255,229,238,.25))}
tr:last-child td{border-bottom:none}
.td-name{font-weight:600;font-family:'Space Grotesk',sans-serif;letter-spacing:-.012em}
.td-mono{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600}
.td-empty{text-align:center;padding:48px 20px;color:var(--text-3);font-size:.88rem}
.td-empty i{font-size:2.2rem;margin-bottom:12px;display:block;color:var(--border)}
.badge{display:inline-flex;align-items:center;padding:4px 10px;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:var(--radius-full);font-family:'JetBrains Mono',monospace;border:1px solid rgba(167,139,250,.18);background:var(--accent-light);color:var(--accent-dark)}
.badge.success{background:var(--success-light);color:#1e8e5d;border-color:rgba(60,203,138,.22)}
.badge.warn{background:#fff4dd;color:#a26a10;border-color:rgba(255,184,77,.28)}
.badge.danger{background:var(--danger-light);color:#c53052;border-color:rgba(255,93,122,.22)}
.badge.sky{background:var(--accent-sky-lt);color:#2f6fa8}
.badge-mayor{background:linear-gradient(135deg,#bcdfff,#a78bfa);color:#fff;border:none;box-shadow:0 4px 12px rgba(167,139,250,.3)}
.badge-detal{background:linear-gradient(135deg,#ffb3d1,#ff6b9a);color:#fff;border:none;box-shadow:0 4px 12px rgba(255,107,154,.3)}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:var(--radius-full);font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text-2);transition:all var(--t);font-family:inherit}
.chip:hover{background:var(--bg-soft);transform:translateY(-1px)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.68rem;font-weight:700;color:var(--text-2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,#fbfaff,var(--bg-soft));font-size:.9rem;color:var(--text-1);font-family:inherit;transition:all var(--t);font-weight:500}
.form-group input::placeholder{color:var(--text-3)}
.form-group input:focus,.form-group select:focus{outline:none;background:var(--bg-card);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-light)}
.fg{display:grid;gap:14px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.modal-overlay{position:fixed;inset:0;background:rgba(29,27,46,.32);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s ease-out}
.modal-box{background:linear-gradient(180deg,#fff,#fefcff);border:1px solid var(--hairline);border-radius:24px;box-shadow:var(--shadow-xl);padding:32px;max-width:560px;width:100%;max-height:calc(100vh - 40px);animation:modalIn .26s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-pink),var(--accent),var(--accent-sky),var(--accent-mint));opacity:.55}
.modal-box h3{font-size:1.2rem;margin-bottom:20px;flex-shrink:0;position:relative;padding-left:18px}
.modal-box h3::before{content:'\2736';position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--accent);font-size:.7em;opacity:.7}
.modal-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;margin:0 -32px;padding:0 32px;min-height:0;scrollbar-width:thin}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);flex-shrink:0}
.toast-container{position:fixed;top:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{padding:13px 18px;border-radius:16px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .36s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(12px);border:1px solid var(--hairline);pointer-events:auto;min-width:220px;max-width:310px}
.toast.success{background:rgba(220,247,232,.95);color:#0f5c38}
.toast.error{background:rgba(255,228,234,.95);color:#8f2740}
.toast.info{background:rgba(255,255,255,.92);color:var(--text-1)}
.act-list{list-style:none}
.act-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.act-item:last-child{border-bottom:none}
.act-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:.88rem;flex-shrink:0}
.act-icon.v{background:var(--accent-pink-lt);color:#c0396a}
.act-icon.s{background:var(--accent-sky-lt);color:#1a6ba8}
.act-info{flex:1}.act-name{font-weight:600;font-size:.88rem}
.act-meta{font-size:.75rem;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-top:1px}
.act-amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem}
.sr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:.9rem}
.sr:last-child{border-bottom:none}
.sr-lbl{color:var(--text-2);font-weight:500}.sr-val{font-family:'JetBrains Mono',monospace;font-weight:700}
.sr.total .sr-lbl{font-weight:700;color:var(--text-1)}.sr.total .sr-val{font-size:1.05rem}
.pos{color:var(--success)}.neg{color:var(--danger)}.warn-c{color:var(--warning)}

<body>
<div class="toast-container" id="toasts"></div>
<div id="modalContainer"></div>
<div id="root"><div class="loading-screen" id="loadingScreen"><div class="spinner"></div><span>Conectando con Amadamia…</span></div></div>
<script>
'use strict';
// ══════════════════════════════════════════════════════════
//  🔥 FIREBASE CONFIG — REEMPLAZA CON TUS DATOS
// ══════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAcmPUSja3XMit5_gY4VCMILIbS-zfrApg",
  authDomain: "amadamia2.firebaseapp.com",
  projectId: "amadamia2",
  storageBucket: "amadamia2.firebasestorage.app",
  messagingSenderId: "238178857115",
  appId: "1:238178857115:web:26b288af74249e9915d63e"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── Constantes ──
const STORE_COLORS = ['#a78bfa','#ffb3d1','#3ccb8a','#bcdfff','#ffb84d'];
const CATS = ['Vestido','Corset','Blusa','Conjunto','Otro'];
const CAT_ICONS = {Vestido:'👗',Corset:'🪢',Blusa:'👚',Conjunto:'✨',Otro:'📦'};
const GASTO_CATS = ['Arriendo','Servicios públicos','Transporte','Publicidad','Empaque','Nómina','Compra mercancía','Otro'];

// ── Estado global ──
const S = { user:null, profile:null, view:'home', storeId:null, stores:{}, products:{}, ventas:[], gastos:[], cierres:[], movimientos:[], fechaFiltro: null, finPeriodo:'semana', finDia:null, finMes:null, finAnio:null, editPid:null };
let _unsubs = [];

// ── Utilidades ──
const COP = n => '$' + Math.round(Number(n||0)).toLocaleString('es-CO');
const today = () => new Date().toISOString().split('T')[0];
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const isAdmin = () => S.profile?.rol === 'admin';



// Colores fijos por talla
const TALLA_COLORES = {
  'P':    '#27ae60', // Verde
  'P.G':  '#c9a84c', // Mostaza
  'X.G':  '#2980b9', // Azul
  'X.X.G':'#8e44ad', // Morado
  'XXG':  '#8e44ad', // Morado
  'S':    '#27ae60', // Verde
  'M':    '#c9a84c', // Mostaza
  'L':    '#2980b9', // Azul
  'XL':   '#8e44ad', // Morado
  'XXL':  '#c0392b', // Rojo
  'UNICA':'#e91e8c', // Rosa
  'ÚNICA':'#e91e8c', // Rosa
};
function tallaColor(talla){
  const t = (talla||'').toUpperCase().trim();
  return TALLA_COLORES[t] || '#7f8c8d'; // Gris para las demás
}
const catIcon = c => CAT_ICONS[c]||'📦';

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const icons = {success:'<i class="fas fa-check"></i>',error:'<i class="fas fa-circle-exclamation"></i>',info:'<i class="fas fa-circle-info"></i>'};
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `${icons[type]||''}<span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>t.style.opacity='0',2800);
  setTimeout(()=>t.remove(),3200);
}
function openModal(html) { document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" id="moverlay" onclick="closeMob(event)" style="overflow-y:auto">${html}</div>`; }
function closeModal() { document.getElementById('modalContainer').innerHTML=''; document.body.style.overflow=''; }
function closeMob(e) { if(e.target.id==='moverlay') closeModal(); }

function storeStats(sid) {
  const v=S.ventas.filter(x=>x.storeId===sid), g=S.gastos.filter(x=>x.storeId===sid);
  const tv=v.reduce((s,x)=>s+x.precio*x.cant,0);
  const tc=v.reduce((s,x)=>{
    const p=S.products[x.pid];
    return s+(p?p.costo:x.costo)*x.cant;
  },0);
  const tg=g.reduce((s,x)=>s+x.monto,0);
  return { tv, tc, tg, utilBruta:tv-tc, utilNeta:tv-tc-tg, cnt:v.length };
}

// ══════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════
function renderLogin(err='') {
  document.getElementById('root').innerHTML = `
  <div class="login-screen">
    <div class="login-box">
      <div class="login-flower">✿</div>
      <div class="login-logo">Amadamia</div>
      <div class="login-sub">Sistema PRO · Inicia sesión</div>
      ${err?`<div class="login-error" style="display:block">${esc(err)}</div>`:''}
      <div class="form-group"><label>Correo electrónico</label>
        <input id="li-e" type="email" placeholder="tu@correo.com" autocomplete="email"/>
      </div>
      <div class="form-group"><label>Contraseña</label>
        <input id="li-p" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">
        <i class="fas fa-arrow-right-to-bracket"></i> Entrar
      </button>
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:.74rem;color:var(--text-3);text-align:center;font-family:'JetBrains Mono',monospace">
        Amadamia PRO · Acceso restringido
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('li-e')?.focus(),100);
}

async function doLogin() {
  const email = document.getElementById('li-e')?.value?.trim();
  const pass  = document.getElementById('li-p')?.value;
  if(!email||!pass){renderLogin('Completa correo y contraseña');return;}
  try { await auth.signInWithEmailAndPassword(email,pass); }
  catch(e) {
    const msgs = {'auth/user-not-found':'Usuario no encontrado','auth/wrong-password':'Contraseña incorrecta',
      'auth/invalid-email':'Correo inválido','auth/too-many-requests':'Demasiados intentos. Intenta más tarde',
      'auth/invalid-credential':'Correo o contraseña incorrectos'};
    renderLogin((msgs[e.code]||'Error') + ' · ' + (e.code||e.message));
  }
}

async function doLogout() {
  _unsubs.forEach(u=>u()); _unsubs=[];
  await auth.signOut();
}

// ══════════════════════════════════════════════════════════
//  FIRESTORE LISTENERS
// ══════════════════════════════════════════════════════════
function startListeners() {
  _unsubs.forEach(u=>u()); _unsubs=[];
  let _ready = {stores:false, products:false, ventas:false, gastos:false, cierres:false, movimientos:false};
  function tryRender(key){ _ready[key]=true; if(Object.values(_ready).every(Boolean)) renderApp(); }

  _unsubs.push(db.collection('stores').onSnapshot(snap=>{
    S.stores={};snap.forEach(d=>{S.stores[d.id]={id:d.id,...d.data()};});tryRender('stores');
  }, err=>console.error('stores:',err)));

  _unsubs.push(db.collection('products').onSnapshot(snap=>{
    S.products={};snap.forEach(d=>{S.products[d.id]={id:d.id,...d.data()};});tryRender('products');
  }, err=>console.error('products:',err)));

  // Ventas - sin orderBy para evitar índice compuesto, ordenamos en JS
  let vq=db.collection('ventas').where('storeId','in', Object.keys(S.stores).length ? Object.keys(S.stores) : ['_none_']);
  if(!isAdmin()&&S.profile?.storeId) vq=db.collection('ventas').where('storeId','==',S.profile.storeId);
  else vq=db.collection('ventas');
  _unsubs.push(vq.onSnapshot(snap=>{
    S.ventas=[];
    snap.forEach(d=>S.ventas.push({id:d.id,...d.data()}));
    S.ventas.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    tryRender('ventas');
  }, err=>{ console.error('ventas:',err); S.ventas=[]; tryRender('ventas'); }));

  // Gastos - sin orderBy
  let gq=db.collection('gastos');
  if(!isAdmin()&&S.profile?.storeId) gq=db.collection('gastos').where('storeId','==',S.profile.storeId);
  _unsubs.push(gq.onSnapshot(snap=>{
    S.gastos=[];
    snap.forEach(d=>S.gastos.push({id:d.id,...d.data()}));
    S.gastos.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    tryRender('gastos');
  }, err=>{ console.error('gastos:',err); S.gastos=[]; tryRender('gastos'); }));

  // Movimientos de inventario (Kardex)
  _ready['movimientos'] = false;
  let mq = db.collection('movimientos');
  if(!isAdmin()&&S.profile?.storeId) mq = db.collection('movimientos').where('storeId','==',S.profile.storeId);
  _unsubs.push(mq.onSnapshot(snap=>{
    S.movimientos=[];
    snap.forEach(d=>S.movimientos.push({id:d.id,...d.data()}));
    S.movimientos.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    tryRender('movimientos');
  }, err=>{ console.error('movimientos:',err); S.movimientos=[]; tryRender('movimientos'); }));

  // Cierres de caja
  _ready['cierres'] = false;
  let cq=db.collection('cierres');
  if(!isAdmin()&&S.profile?.storeId) cq=db.collection('cierres').where('storeId','==',S.profile.storeId);
  _unsubs.push(cq.onSnapshot(snap=>{
    S.cierres=[];
    snap.forEach(d=>S.cierres.push({id:d.id,...d.data()}));
    S.cierres.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    tryRender('cierres');
  }, err=>{ console.error('cierres:',err); S.cierres=[]; tryRender('cierres'); }));
}

// Timeout fallback - si Firebase no responde en 4 segundos, mostrar login
setTimeout(()=>{
  const root = document.getElementById('root');
  if(root && root.querySelector && root.querySelector('.loading-screen')){
    console.log('Firebase timeout - forzando login');
    renderLogin('');
  }
}, 4000);

auth.onAuthStateChanged(async user => {
  if(!user){S.user=null;S.profile=null;renderLogin();return;}
  S.user=user;
  try {
    const doc=await db.collection('users').doc(user.uid).get();
    S.profile=doc.exists?doc.data():{nombre:user.email,rol:'admin',storeId:null};
    if(!doc.exists) await db.collection('users').doc(user.uid).set(S.profile);
  } catch(e){S.profile={nombre:user.email,rol:'admin',storeId:null};}
  if(!isAdmin()&&S.profile?.storeId){S.storeId=S.profile.storeId;S.view='store';}
  startListeners();
});

// ══════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════
function navigate(view,storeId=null){
  if(!isAdmin()&&(view==='home'||view==='resumen'||view==='usuarios'))return;
  // Empleada: si no tiene storeId en el view, usar su storeId asignado
  if(!isAdmin()&&!storeId&&S.profile?.storeId) storeId=S.profile.storeId;
  S.view=view;S.storeId=storeId;renderApp();
}

function renderApp() {
  if(!S.user||!S.profile)return;
  document.getElementById('root').innerHTML=buildLayout();
  document.querySelectorAll('.nav-item').forEach(b=>{
    const v=b.dataset.view,st=b.dataset.store;
    b.classList.toggle('active',(v&&v===S.view&&!st&&!S.storeId)||(st&&st===S.storeId));
  });
}

function buildLayout(){return`<div class="app-layout">${buildSidebar()}<div class="main-area">${buildTopbar()}<div class="main-content">${buildView()}</div></div></div>`;}

function buildSidebar(){
  const stores=Object.values(S.stores);
  const p=S.profile;
  const avatarBg=isAdmin()?'linear-gradient(135deg,var(--accent),var(--accent-dark))':'linear-gradient(135deg,var(--success),#2fb378)';
  const initials=(p?.nombre||'U')[0].toUpperCase();
  return `<aside class="sidebar">
    <div class="sidebar-brand"><h2>Amadamia</h2><div class="brand-sub">Sistema PRO</div></div>
    <nav class="sidebar-nav">
      ${isAdmin()?`
      <span class="nav-section">Principal</span>
      <button class="nav-item" data-view="home" onclick="navigate('home')"><i class="fas fa-chart-pie"></i> Dashboard</button>
      <button class="nav-item" data-view="resumen" onclick="navigate('resumen')"><i class="fas fa-calculator"></i> Resumen Global</button>
      <span class="nav-section">Puntos físicos</span>
      ${stores.map(s=>`<button class="nav-item" data-store="${s.id}" onclick="navigate('store','${s.id}')">
        <span class="nav-dot" style="background:${esc(s.color)}"></span>${esc(s.name)}</button>
      <button class="nav-item" data-view="finanzas" style="padding-left:28px;font-size:.82rem" onclick="navigate('finanzas','${s.id}')">
        <i class="fas fa-calendar-week" style="font-size:.8rem"></i> Finanzas semanales</button>
      <button class="nav-item" style="padding-left:28px;font-size:.82rem;color:var(--rose)" onclick="navigate('cierres','${s.id}')">
        <i class="fas fa-cash-register" style="font-size:.8rem"></i> Cierres de caja</button>
      <button class="nav-item" style="padding-left:28px;font-size:.82rem" onclick="navigate('kardex','${s.id}')">
        <i class="fas fa-right-left" style="font-size:.8rem"></i> Kardex movimientos</button>`).join('')}
      <button class="nav-item" type="button" onclick="navigate('nuevopunto')"><i class="fas fa-plus" style="color:var(--accent)"></i> Nuevo punto</button>
      <span class="nav-section">Accesos</span>
      <button class="nav-item" data-view="usuarios" onclick="navigate('usuarios')"><i class="fas fa-users"></i> Empleadas</button>
      <button class="nav-item" data-view="clientes" onclick="navigate('clientes')"><i class="fas fa-address-book"></i> Clientes mayoristas</button>
      `:`
      <span class="nav-section">Mi punto</span>
      ${stores.filter(s=>s.id===S.profile?.storeId).map(s=>`
      <button class="nav-item" data-store="${s.id}" onclick="navigate('store','${s.id}')">
        <span class="nav-dot" style="background:${esc(s.color)}"></span>${esc(s.name)}</button>
      <button class="nav-item" data-view="finanzas" onclick="navigate('finanzas','${s.id}')">
        <i class="fas fa-calendar-week"></i> Finanzas semanales</button>
      <button class="nav-item" style="background:rgba(201,132,122,.12);color:var(--rose)" onclick="navigate('cierre','${s.id}')">
        <i class="fas fa-cash-register"></i> Cierre de caja</button>
      <button class="nav-item" onclick="navigate('movimiento','${s.id}')">
        <i class="fas fa-right-left"></i> Registrar movimiento</button>
      <button class="nav-item" style="background:rgba(21,101,192,.1);color:#1565c0" onclick="navigate('conteo','${s.id}')">
        <i class="fas fa-clipboard-list"></i> Conteo físico</button>`).join('')}
      `}
    </nav>
    <div class="sidebar-footer">
      <div class="user-pill" onclick="confirmLogout()">
        <div class="user-avatar" style="background:${avatarBg}">${initials}</div>
        <div class="user-info"><div class="user-name">${esc(p?.nombre||'Usuario')}</div></div>
        <span class="role-badge ${isAdmin()?'role-admin':'role-emp'}">${isAdmin()?'Admin':'Emp.'}</span>
      </div>
      <div style="text-align:center;font-size:.6rem">Cerrar sesión ↑</div>
    </div>
  </aside>`;
}

function buildTopbar(){
  const titles={home:'Dashboard',resumen:'Resumen Global',usuarios:'Empleadas',store:''};
  let title=titles[S.view]||'',chip='';
  if(S.storeId){const st=S.stores[S.storeId];title=st?.name||'Punto';
    chip=st?`<span class="store-chip"><span class="store-chip-dot" style="background:${esc(st.color)}"></span>${esc(st.location)}</span>`:'';
  }
  return `<div class="topbar"><span class="topbar-title">${esc(title)}</span>${chip}</div>`;
}

function buildView(){
  // Vistas permitidas para empleada
  const sid = S.storeId || S.profile?.storeId;
  if(!isAdmin()){
    if(S.view==='nuevoproducto') return `<div class="info-box"><div class="info-icon"><i class="fas fa-lock"></i></div><div class="info-text"><strong>Acceso restringido</strong><p>Solo la administradora puede agregar productos.</p></div></div><button class="btn" onclick="navigate('store','${sid}')">Volver</button>`;
    if(S.view==='editarproducto') return `<div class="info-box"><div class="info-icon"><i class="fas fa-lock"></i></div><div class="info-text"><strong>Acceso restringido</strong><p>Solo la administradora puede editar productos.</p></div></div><button class="btn" onclick="navigate('store','${sid}')">Volver</button>`;
    if(S.view==='nuevaventa') return buildNuevaVenta(sid);
    if(S.view==='nuevogasto') return buildNuevoGasto(sid);
    if(S.view==='finanzas') return buildFinanzasSemanales(sid);
    if(S.view==='cierre') return buildCierreCaja(sid);
    if(S.view==='conteo') return buildConteoFisico(sid);
    if(S.view==='ventamayor') return buildVentaMayorista(sid);
    if(S.view==='ventamultiple') return buildVentaMultipleDetal(sid);
    if(S.view==='movimiento') return buildRegistrarMovimiento(sid);
    if(sid) return buildStoreView(sid);
    return `<div class="info-box"><div class="info-icon"><i class="fas fa-lock"></i></div><div class="info-text"><strong>Acceso restringido</strong><p>Contacta a la administradora.</p></div></div>`;
  }
  if(S.view==='resumen') return buildResumen();
  if(S.view==='usuarios') return buildUsuarios();
  if(S.view==='nuevopunto') return buildNuevoPunto();
  if(S.view==='editarpunto') return buildEditarPunto(S.storeId);
  if(S.view==='nuevoproducto') return buildNuevoProducto(S.storeId);
  if(S.view==='editarproducto') return buildNuevoProducto(S.storeId, S.editPid);
  if(S.view==='nuevaventa') return buildNuevaVenta(S.storeId);
  if(S.view==='nuevogasto') return buildNuevoGasto(S.storeId);
  if(S.view==='finanzas') return buildFinanzasSemanales(S.storeId);
  if(S.view==='clientes') return buildClientes();
  if(S.view==='cierre') return buildCierreCaja(S.storeId);
  if(S.view==='conteo') return buildConteoFisico(S.storeId);
  if(S.view==='ventamayor') return buildVentaMayorista(S.storeId);
  if(S.view==='ventamultiple') return buildVentaMultipleDetal(S.storeId);
  if(S.view==='cierres') return buildListaCierres(S.storeId||Object.keys(S.stores)[0]);
  if(S.view==='kardex') return buildKardex(S.storeId);
  if(S.storeId) return buildStoreView(S.storeId);
  return buildHome();
}

        '<td style="white-space:nowrap">'+adminBtns+'</td>' +
        '</tr>';
    }).join('');
  })();

const vCols=isAdmin()?9:8;
  const ventaRows=ventas.length?ventas.map(v=>{

function buildResumen(){
  const stores=Object.values(S.stores);
  const tv=S.ventas.reduce((s,v)=>s+v.precio*v.cant,0);
  const tc=S.ventas.reduce((s,v)=>{
    const p=S.products[v.pid];
    return s+(p?p.costo:v.costo)*v.cant;
  },0);
  const tg=S.gastos.reduce((s,g)=>s+g.monto,0);
  const ub=tv-tc,un=ub-tg,margen=tv>0?((un/tv)*100).toFixed(1):0;
  const vM=S.ventas.filter(v=>v.tipo==='mayor').reduce((s,v)=>s+v.precio*v.cant,0);
  const vD=S.ventas.filter(v=>v.tipo==='detal').reduce((s,v)=>s+v.precio*v.cant,0);
  const gcats={};S.gastos.forEach(g=>{gcats[g.cat]=(gcats[g.cat]||0)+g.monto;});
  const gcatRows=Object.entries(gcats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sr"><span class="sr-lbl">${esc(k)}</span><span class="sr-val neg">${COP(v)}</span></div>`).join('')||'<div class="sr"><span class="sr-lbl" style="color:var(--text-3)">Sin gastos</span><span class="sr-val">$0</span></div>';
  const vcats={};S.ventas.forEach(v=>{const p=S.products[v.pid];const c=p?p.cat:'Otro';vcats[c]=(vcats[c]||0)+v.precio*v.cant;});
  const vcatRows=Object.entries(vcats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sr"><span class="sr-lbl">${catIcon(k)} ${esc(k)}</span><span class="sr-val">${COP(v)}</span></div>`).join('')||'<div class="sr"><span class="sr-lbl" style="color:var(--text-3)">Sin ventas</span><span class="sr-val">$0</span></div>';
  return`
  <div class="dx-header"><div class="dx-eyebrow">Amadamia · Análisis financiero</div>
    <h1 style="font-size:1.6rem;letter-spacing:-.03em">Resumen Global</h1>
    <p style="font-size:.9rem;color:var(--text-2);margin-top:4px">Consolidado de todos los puntos físicos</p></div>
  <div class="fin-result">
    <div class="fin-head"><div class="fin-head-title"><i class="fas fa-chart-line"></i> Resultado operativo consolidado</div></div>
    <div class="fin-body"><div class="fin-grid">
      <div><div class="fin-big-lbl">Ventas totales</div><div class="fin-big-val pos">${COP(tv)}</div><div class="fin-big-hint">Mayor: ${COP(vM)} · Detal: ${COP(vD)}</div></div>
      <div><div class="fin-big-lbl">Egresos totales</div><div class="fin-big-val neg">${COP(tc+tg)}</div><div class="fin-big-hint">Mercancía: ${COP(tc)} + Gastos: ${COP(tg)}</div></div>
      <div class="fin-big-hero"><div class="fin-big-lbl">Utilidad neta ✦</div><div class="fin-big-val ${un>=0?'pos':'neg'}">${COP(un)}</div>
        <div class="fin-big-pct ${un>=0?'pos':'neg'}">Margen: ${margen}%</div><div class="fin-big-hint">Utilidad bruta: ${COP(ub)}</div></div>
    </div></div></div>
  <h3 class="sec-title">Por punto físico</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:28px">
    ${stores.map(s=>{const st=storeStats(s.id);const mg=st.tv>0?((st.utilNeta/st.tv)*100).toFixed(1):0;
      return`<div class="card" style="padding:20px 22px;border-top:4px solid ${esc(s.color)}">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <div style="width:10px;height:10px;border-radius:50%;background:${esc(s.color)}"></div>
          <div style="font-weight:700;font-family:'Space Grotesk',sans-serif">${esc(s.name)}</div>
          <button onclick="navigate('editarpunto','${s.id}')" style="margin-left:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.75rem;color:var(--text-2)">
            <i class="fas fa-pen"></i> Editar
          </button>
          <div style="margin-left:auto;font-size:.72rem;color:var(--text-3);font-family:'JetBrains Mono',monospace">${esc(s.location)}</div>
        </div>
        <div class="sr"><span class="sr-lbl">Ventas</span><span class="sr-val pos">${COP(st.tv)}</span></div>
        <div class="sr"><span class="sr-lbl">Costo mercancía</span><span class="sr-val neg">${COP(st.tc)}</span></div>
        <div class="sr"><span class="sr-lbl">Gastos</span><span class="sr-val neg">${COP(st.tg)}</span></div>
        <div class="sr total"><span class="sr-lbl">Utilidad neta</span><span class="sr-val ${st.utilNeta>=0?'pos':'neg'}">${COP(st.utilNeta)}</span></div>
        <div style="margin-top:8px;font-size:.72rem;color:var(--text-3);font-family:'JetBrains Mono',monospace">Margen: ${mg}% · ${S.ventas.filter(v=>v.storeId===s.id).length} venta(s)</div>
      </div>`;}).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">
    <div class="card" style="padding:20px 22px"><h3 style="font-size:.9rem;margin-bottom:14px"><i class="fas fa-arrow-up" style="color:var(--success)"></i> Ingresos</h3>
      <div class="sr"><span class="sr-lbl"><span class="badge badge-mayor" style="margin-right:5px">Mayor</span></span><span class="sr-val">${COP(vM)}</span></div>
      <div class="sr"><span class="sr-lbl"><span class="badge badge-detal" style="margin-right:5px">Detal</span></span><span class="sr-val">${COP(vD)}</span></div>
      <div class="sr total"><span class="sr-lbl">Total</span><span class="sr-val pos">${COP(tv)}</span></div></div>
    <div class="card" style="padding:20px 22px"><h3 style="font-size:.9rem;margin-bottom:14px"><i class="fas fa-receipt" style="color:var(--danger)"></i> Gastos por cat.</h3>${gcatRows}
      <div class="sr total"><span class="sr-lbl">Total gastos</span><span class="sr-val neg">${COP(tg)}</span></div></div>
    <div class="card" style="padding:20px 22px"><h3 style="font-size:.9rem;margin-bottom:14px"><i class="fas fa-shirt" style="color:var(--accent)"></i> Ventas por cat.</h3>${vcatRows}
      <div class="sr total"><span class="sr-lbl">Total</span><span class="sr-val">${COP(tv)}</span></div></div>
  </div>`;
}

let _vmdItems = [];

function buscarRefMultipleDetal(query, sid){
  const prods = Object.values(S.products).filter(p=>p.storeId===sid);
  const grupos = {};
  prods.forEach(p=>{
    const key = p.nombre.trim().toUpperCase();
    if(!grupos[key]) grupos[key]={nombre:p.nombre,cat:p.cat,tallas:[]};
    grupos[key].tallas.push(p);
  });
  const dd = document.getElementById('vmd-dropdown');
  if(!dd) return;
  const q = (query||'').toLowerCase();
  const filtrados = Object.values(grupos).filter(g=>!q||g.nombre.toLowerCase().includes(q));
  if(!filtrados.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML = filtrados.map((g,gi)=>{
    const st = g.tallas.reduce((s,t)=>s+t.stock,0);
    return '<div id="vmddd-'+gi+'" data-nombre="'+encodeURIComponent(g.nombre)+'" data-sid="'+sid+'"'+
      ' style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee">'+
      '<div style="font-weight:600;font-size:.88rem">'+esc(g.nombre)+'</div>'+
      '<div style="font-size:.72rem;color:#999">Tallas: '+g.tallas.map(t=>t.talla||'-').join(', ')+'</div>'+
    '</div>';
  }).join('');
  filtrados.forEach((g,gi)=>{
    const el = document.getElementById('vmddd-'+gi);
    if(el){
      el.addEventListener('mouseenter',function(){this.style.background='#f5f3ff';});
      el.addEventListener('mouseleave',function(){this.style.background='';});
      el.addEventListener('click',function(){
        document.getElementById('vmd-search').value = decodeURIComponent(this.dataset.nombre);
        dd.style.display='none';
        elegirRefMultipleDetal(this.dataset.sid, this.dataset.nombre);
      });
    }
  });
}

function elegirRefMultipleDetal(sid, nombreEnc){
  const nombre = decodeURIComponent(nombreEnc);
  const prods = Object.values(S.products).filter(p=>p.storeId===sid && p.nombre.trim().toUpperCase()===nombre.trim().toUpperCase());
  const wrap = document.getElementById('vmd-tallas');
  if(!wrap) return;
  wrap.innerHTML = prods.map((p,pi)=>{
    const tc = tallaColor(p.talla);
    return '<button type="button" id="vmdtalla-'+pi+'" data-pid="'+p.id+'" data-stock="'+p.stock+'"'+
      ' style="border:2px solid '+tc+'60;background:'+tc+'15;border-radius:10px;padding:7px 12px;cursor:pointer;font-family:inherit">'+
      '<div style="font-weight:700;color:'+tc+';font-size:.88rem">'+esc(p.talla||'-')+'</div>'+
      '<div style="font-size:.62rem;color:#666">Stock: '+p.stock+'</div>'+
    '</button>';
  }).join('');
  prods.forEach((_,pi)=>{
    const btn = document.getElementById('vmdtalla-'+pi);
    if(btn) btn.addEventListener('click',function(){
      document.getElementById('vmd-pid').value = this.dataset.pid;
      wrap.querySelectorAll('button').forEach(b=>b.style.outline='none');
      this.style.outline = '3px solid var(--accent)';
    });
  });
}

function agregarItemMultipleDetal(sid){
  const pid = document.getElementById('vmd-pid').value;
  const cant = parseInt(document.getElementById('vmd-cant').value)||0;
  if(!pid){toast('Selecciona una referencia y talla','error');return;}
  if(cant<=0){toast('La cantidad debe ser mayor a 0','error');return;}
  const p = S.products[pid];
  if(!p){toast('Producto no encontrado','error');return;}
  if(cant > p.stock){toast('Stock insuficiente. Disponible: '+p.stock,'error');return;}
  
  const existing = _vmdItems.find(i=>i.pid===pid);
  if(existing){
    existing.cant += cant;
    if(existing.cant > p.stock){ existing.cant = p.stock; toast('Ajustado al máximo: '+p.stock,'warn'); }
  } else {
    _vmdItems.push({pid,nombre:p.nombre,talla:p.talla||'-',cant,precio:p.precioDetal,costo:p.costo,stock:p.stock});
  }
  
  document.getElementById('vmd-pid').value='';
  document.getElementById('vmd-search').value='';
  document.getElementById('vmd-cant').value='1';
  document.getElementById('vmd-tallas').innerHTML='<span style="color:var(--text-3);font-size:.82rem">Selecciona una referencia</span>';
  renderItemsMultipleDetal();
}

function renderItemsMultipleDetal(){
  const wrap = document.getElementById('vmd-items');
  const totalWrap = document.getElementById('vmd-total-wrap');
  if(!wrap) return;
  if(!_vmdItems.length){
    wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3);font-size:.85rem"><i class="fas fa-shopping-bag" style="font-size:1.5rem;margin-bottom:8px;display:block;opacity:.3"></i>Sin productos aún</div>';
    if(totalWrap) totalWrap.style.display='none';
    return;
  }
  const totalUds = _vmdItems.reduce((s,i)=>s+i.cant,0);
  const total = _vmdItems.reduce((s,i)=>s+i.precio*i.cant,0);
  wrap.innerHTML = _vmdItems.map((item,idx)=>{
    const tc = tallaColor(item.talla);
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee">'+
      '<span style="background:'+tc+'20;color:'+tc+';border:1px solid '+tc+'40;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700">'+esc(item.talla)+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(item.nombre)+'</div>'+
        '<div style="font-size:.7rem;color:#999">'+item.cant+' × '+COP(item.precio)+' = '+COP(item.precio*item.cant)+'</div>'+
      '</div>'+
      '<button onclick="_vmdItems.splice('+idx+',1);renderItemsMultipleDetal()" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:.8rem;padding:4px">✕</button>'+
    '</div>';
  }).join('');
  if(totalWrap){
    totalWrap.style.display='block';
    document.getElementById('vmd-total-uds').textContent = totalUds+' uds';
    document.getElementById('vmd-total-cop').textContent = COP(total);
  }
}

async function confirmarVentaMultipleDetal(sid){
  if(!_vmdItems.length){toast('Agrega al menos un producto','error');return;}
  const clienteNombre = document.getElementById('vmd-cliente').value.trim();
  const medioPago = document.getElementById('vmd-pago').value;
  const fecha = document.getElementById('vmd-fecha').value||today();
  try {
    const batch = db.batch();
    _vmdItems.forEach(item=>{
      const vref = db.collection('ventas').doc();
      batch.set(vref,{
        storeId:sid, pid:item.pid, nombre:item.nombre, talla:item.talla,
        cant:item.cant, precio:item.precio, costo:item.costo, tipo:'detal',
        fecha, medioPago, clienteNombre, afectarInv:true,
        ventaGrupo: new Date().toISOString(),
        creadoPor:S.profile?.nombre||'', createdAt:new Date().toISOString()
      });
      batch.update(db.collection('products').doc(item.pid),{
        stock:firebase.firestore.FieldValue.increment(-item.cant)
      });
    });
    await batch.commit();
    _vmdItems = [];
    toast('Venta registrada correctamente','success');
    navigate('store',sid);
  } catch(e){
    toast('Error: '+e.message,'error');
  }
}

// Estado temporal de la venta mayorista
let _vmItems = [];

function buscarRefMayorista(query, sid){
  const prods = Object.values(S.products).filter(p=>p.storeId===sid);
  const grupos = {};
  prods.forEach(p=>{
    const key = p.nombre.trim().toUpperCase();
    if(!grupos[key]) grupos[key]={nombre:p.nombre,cat:p.cat,tallas:[]};
    grupos[key].tallas.push({id:p.id,talla:p.talla||'-',stock:p.stock});
  });
  const dd = document.getElementById('vm-dropdown');
  if(!dd) return;
  const q = query.toLowerCase();
  const filtrados = Object.values(grupos).filter(g=>!q||g.nombre.toLowerCase().includes(q));
  if(!filtrados.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML = filtrados.map((g,gi)=>{
    const st = g.tallas.reduce((s,t)=>s+t.stock,0);
    return '<div id="vmdd-'+gi+'" data-nombre="'+encodeURIComponent(g.nombre)+'" data-sid="'+sid+'"'+
      ' style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee">'+
      '<div style="font-weight:600;font-size:.88rem">'+esc(g.nombre)+'</div>'+
      '<div style="font-size:.72rem;color:#999">Tallas: '+g.tallas.map(t=>t.talla).join(', ')+' · Stock total: '+st+'</div>'+
    '</div>';
  }).join('');
  filtrados.forEach((g,gi)=>{
    const el = document.getElementById('vmdd-'+gi);
    if(el){
      el.addEventListener('mouseenter',function(){this.style.background='#f5f3ff';});
      el.addEventListener('mouseleave',function(){this.style.background='';});
      el.addEventListener('click',function(){
        elegirRefMayorista(this.dataset.sid, this.dataset.nombre);
      });
    }
  });
}

function elegirRefMayorista(sid, nombreEnc){
  const nombre = decodeURIComponent(nombreEnc);
  document.getElementById('vm-search').value = nombre;
  document.getElementById('vm-dropdown').style.display = 'none';
  const prods = Object.values(S.products).filter(p=>p.storeId===sid && p.nombre.trim().toUpperCase()===nombre.trim().toUpperCase());
  const wrap = document.getElementById('vm-tallas');
  if(!wrap) return;
  wrap.innerHTML = prods.map((p,pi)=>{
    const tc = tallaColor(p.talla);
    return '<button type="button" id="vmtalla-'+pi+'" data-pid="'+p.id+'" data-stock="'+p.stock+'"'+
      ' style="border:2px solid '+tc+'60;background:'+tc+'15;border-radius:10px;padding:7px 12px;cursor:pointer;font-family:inherit">'+
      '<div style="font-weight:700;color:'+tc+';font-size:.88rem">'+esc(p.talla||'-')+'</div>'+
      '<div style="font-size:.62rem;color:#666">Stock: '+p.stock+'</div>'+
    '</button>';
  }).join('');
  prods.forEach((_,pi)=>{
    const btn = document.getElementById('vmtalla-'+pi);
    if(btn) btn.addEventListener('click',function(){
      document.getElementById('vm-pid').value = this.dataset.pid;
      wrap.querySelectorAll('button').forEach(b=>b.style.outline='none');
      this.style.outline = '3px solid var(--accent)';
    });
  });
}

function agregarItemMayorista(sid){
  const pid = document.getElementById('vm-pid').value;
  const cant = parseInt(document.getElementById('vm-cant').value)||0;
  if(!pid){toast('Selecciona una referencia y talla','error');return;}
  if(cant<=0){toast('La cantidad debe ser mayor a 0','error');return;}
  const p = S.products[pid];
  if(!p){toast('Producto no encontrado','error');return;}
  if(cant > p.stock){toast('Stock insuficiente. Disponible: '+p.stock,'error');return;}
  
  // Verificar si ya está en el pedido
  const existing = _vmItems.find(i=>i.pid===pid);
  if(existing){
    existing.cant += cant;
    if(existing.cant > p.stock){existing.cant = p.stock; toast('Se ajustó al máximo disponible: '+p.stock,'warn');}
  } else {
    _vmItems.push({pid, nombre:p.nombre, talla:p.talla||'-', cant, precioDetal:p.precioDetal, precioMayor:p.precioMayor, costo:p.costo, stock:p.stock});
  }
  
  // Reset form
  document.getElementById('vm-pid').value='';
  document.getElementById('vm-search').value='';
  document.getElementById('vm-cant').value='1';
  document.getElementById('vm-tallas').innerHTML='<span style="color:var(--text-3);font-size:.82rem">Selecciona una referencia</span>';
  
  renderItemsMayorista();
}

function renderItemsMayorista(){
  const wrap = document.getElementById('vm-items');
  const totalWrap = document.getElementById('vm-total-wrap');
  if(!wrap) return;
  
  const totalUds = _vmItems.reduce((s,i)=>s+i.cant,0);
  const esMayor = totalUds >= 6;
  
  // Check if cliente is verified mayorista
  const telInput = document.getElementById('vm-cliente-tel');
  const nombreInput = document.getElementById('vm-cliente-nombre');
  const tel = telInput?.value?.trim()||'';
  const nombre = nombreInput?.value?.trim()||'';
  const clienteKey = (tel||nombre).toLowerCase();
  const clienteVerificado = S.ventas.some(v=>v.tipo==='mayor'&&((v.clienteTel&&v.clienteTel.toLowerCase()===clienteKey)||(v.clienteNombre&&v.clienteNombre.toLowerCase()===clienteKey)));
  
  const aplicaMayor = esMayor || clienteVerificado;
  
  if(!_vmItems.length){
    wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3);font-size:.85rem"><i class="fas fa-shopping-bag" style="font-size:1.5rem;margin-bottom:8px;display:block;opacity:.3"></i>Sin productos aún</div>';
    if(totalWrap) totalWrap.style.display='none';
    return;
  }
  
  const total = _vmItems.reduce((s,i)=>{
    const precio = aplicaMayor ? i.precioMayor : i.precioDetal;
    return s + precio*i.cant;
  },0);
  
  wrap.innerHTML = _vmItems.map((item,idx)=>{
    const precio = aplicaMayor ? item.precioMayor : item.precioDetal;
    const tc = tallaColor(item.talla);
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee">'+
      '<span style="background:'+tc+'20;color:'+tc+';border:1px solid '+tc+'40;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700">'+esc(item.talla)+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(item.nombre)+'</div>'+
        '<div style="font-size:.7rem;color:#999">'+item.cant+' × '+COP(precio)+' = '+COP(precio*item.cant)+'</div>'+
      '</div>'+
      '<button onclick="_vmItems.splice('+idx+',1);renderItemsMayorista()" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:.8rem;padding:4px">✕</button>'+
    '</div>';
  }).join('');
  
  if(totalWrap){
    totalWrap.style.display='block';
    document.getElementById('vm-total-uds').textContent = totalUds + ' uds' + (aplicaMayor?' · ✅ Precio mayorista':' · Precio detal');
    document.getElementById('vm-total-cop').textContent = COP(total);
    const alerta = document.getElementById('vm-alerta-min');
    if(alerta) alerta.style.display = (!esMayor&&!clienteVerificado&&_vmItems.length>0)?'block':'none';
  }
}

function seleccionarClienteRapido(){
  const val = document.getElementById('vm-cliente-rapido').value;
  if(!val) return;
  const parts = val.split('|');
  document.getElementById('vm-cliente-tel').value = parts[0]||'';
  document.getElementById('vm-cliente-nombre').value = parts[1]||'';
  renderItemsMayorista();
}

async function confirmarVentaMayorista(sid){
  if(!_vmItems.length){toast('Agrega al menos un producto','error');return;}
  
  const totalUds = _vmItems.reduce((s,i)=>s+i.cant,0);
  const clienteNombre = document.getElementById('vm-cliente-nombre').value.trim();
  const clienteTel = document.getElementById('vm-cliente-tel').value.trim();
  const medioPago = document.getElementById('vm-pago').value;
  const fecha = document.getElementById('vm-fecha').value||today();
  
  // Verificar si es cliente mayorista verificado
  const clienteKey = (clienteTel||clienteNombre).toLowerCase();
  const clienteVerificado = S.ventas.some(v=>v.tipo==='mayor'&&((v.clienteTel&&v.clienteTel.toLowerCase()===clienteKey)||(v.clienteNombre&&v.clienteNombre.toLowerCase()===clienteKey)));
  
  if(totalUds < 6 && !clienteVerificado){
    toast('Mínimo 6 unidades para precio mayorista. Total actual: '+totalUds,'error');
    return;
  }
  if(!clienteNombre){toast('Ingresa el nombre del cliente','error');return;}
  
  const aplicaMayor = totalUds>=6||clienteVerificado;
  
  try {
    const batch = db.batch();
    _vmItems.forEach(item=>{
      const precio = aplicaMayor ? item.precioMayor : item.precioDetal;
      const vref = db.collection('ventas').doc();
      batch.set(vref,{
        storeId:sid, pid:item.pid, nombre:item.nombre, talla:item.talla,
        cant:item.cant, precio, costo:item.costo, tipo:'mayor',
        fecha, medioPago, clienteNombre, clienteTel,
        afectarInv:true, ventaGrupo: new Date().toISOString(),
        creadoPor:S.profile?.nombre||'', createdAt:new Date().toISOString()
      });
      batch.update(db.collection('products').doc(item.pid),{
        stock:firebase.firestore.FieldValue.increment(-item.cant)
      });
    });
    await batch.commit();
    _vmItems = [];
    toast('Venta mayorista registrada correctamente','success');
    navigate('store',sid);
  } catch(e){
    toast('Error: '+e.message,'error');
  }
}

function buscarRefMovimiento(query, sid){
  const prods = Object.values(S.products).filter(p=>p.storeId===sid);
  const grupos = {};
  prods.forEach(p=>{
    const key = p.nombre.trim().toUpperCase();
    if(!grupos[key]) grupos[key]={nombre:p.nombre, tallas:[]};
    grupos[key].tallas.push(p);
  });
  const dd = document.getElementById('mov-ref-dropdown');
  if(!dd) return;
  const q = (query||'').toLowerCase();
  const filtrados = Object.values(grupos).filter(g=>!q||g.nombre.toLowerCase().includes(q));
  if(!filtrados.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML = filtrados.map((g,gi)=>{
    const st = g.tallas.reduce((s,t)=>s+t.stock,0);
    return '<div id="movdd-'+gi+'" data-nombre="'+encodeURIComponent(g.nombre)+'" data-sid="'+sid+'"'+
      ' style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee">'+
      '<div style="font-weight:600;font-size:.88rem">'+esc(g.nombre)+'</div>'+
      '<div style="font-size:.72rem;color:#999">Tallas: '+g.tallas.map(t=>t.talla||'-').join(', ')+' · Stock: '+st+'</div>'+
    '</div>';
  }).join('');
  filtrados.forEach((g,gi)=>{
    const el = document.getElementById('movdd-'+gi);
    if(el){
      el.addEventListener('mouseenter',function(){this.style.background='#f5f3ff';});
      el.addEventListener('mouseleave',function(){this.style.background='';});
      el.addEventListener('click',function(){
        document.getElementById('mov-ref-search').value = decodeURIComponent(this.dataset.nombre);
        document.getElementById('mov-ref').value = this.dataset.nombre;
        dd.style.display='none';
        cargarTallasMovimiento(this.dataset.sid);
      });
    }
  });
  // Close on outside click
  document.addEventListener('click',function(e){
    if(!dd.contains(e.target)&&e.target.id!=='mov-ref-search') dd.style.display='none';
  },{once:true});
}

function cargarTallasMovimiento(sid){
  const refEnc = document.getElementById('mov-ref')?.value || encodeURIComponent(document.getElementById('mov-ref-search')?.value||'');
  if(!refEnc){ document.getElementById('mov-tallas-wrap').innerHTML='<span style="color:var(--text-3);font-size:.85rem">Primero selecciona una referencia</span>'; return; }
  const nombre = decodeURIComponent(refEnc);
  const prods = Object.values(S.products).filter(p=>p.storeId===sid && p.nombre.trim().toUpperCase()===nombre.trim().toUpperCase());
  const wrap = document.getElementById('mov-tallas-wrap');
  wrap.innerHTML = prods.map((p,pi)=>{
    const tc = tallaColor(p.talla);
    const bc = p.stock===0?'#e74c3c':p.stock<=3?'#f39c12':'#27ae60';
    return '<button type="button" id="mtalla-'+pi+'" data-pid="'+p.id+'" data-stock="'+p.stock+'" data-talla="'+esc(p.talla||'-')+'"'+
      ' style="border:2px solid '+tc+'60;background:'+tc+'15;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit">'+
      '<div style="font-weight:700;color:'+tc+';font-size:.9rem">'+esc(p.talla||'-')+'</div>'+
      '<div style="font-size:.65rem;color:'+bc+'">Stock: '+p.stock+'</div>'+
    '</button>';
  }).join('');
  prods.forEach((_,pi)=>{
    const btn = document.getElementById('mtalla-'+pi);
    if(btn) btn.addEventListener('click',function(){
      document.getElementById('mov-pid').value = this.dataset.pid;
      document.getElementById('mov-stock-info').textContent = 'Talla '+this.dataset.talla+' · Stock actual: '+this.dataset.stock;
      wrap.querySelectorAll('button').forEach(b=>b.style.outline='none');
      this.style.outline = '2px solid var(--accent)';
    });
  });
}

async function guardarMovimiento(sid){
  const tipo = document.getElementById('mov-tipo').value;
  const motivo = document.getElementById('mov-motivo').value;
  const pid = document.getElementById('mov-pid').value;
  const cantidad = parseInt(document.getElementById('mov-cantidad').value)||0;
  const fecha = document.getElementById('mov-fecha').value||today();
  const nota = document.getElementById('mov-nota').value||'';
  const destino = document.getElementById('mov-destino')?.value||'';
  
  if(!pid){ toast('Selecciona una referencia y talla','error'); return; }
  if(!cantidad||cantidad<=0){ toast('La cantidad debe ser mayor a 0','error'); return; }
  
  const p = S.products[pid];
  if(!p){ toast('Producto no encontrado','error'); return; }
  
  if(tipo==='salida' && cantidad > p.stock){
    toast('No hay suficiente stock. Disponible: '+p.stock,'error'); return;
  }
  
  try {
    // Guardar movimiento pendiente de confirmación
    await db.collection('movimientos').add({
      storeId: sid,
      pid: pid,
      nombreProducto: p.nombre,
      talla: p.talla||'-',
      tipo: tipo,
      motivo: motivo,
      cantidad: cantidad,
      fecha: fecha,
      nota: nota,
      destinoId: destino,
      destinoNombre: destino ? (S.stores[destino]?.name||'') : '',
      registradoPor: S.profile?.nombre||'',
      confirmado: false,
      creadoEn: new Date().toISOString()
    });
    toast('Movimiento registrado. Esperando confirmación de la administradora.','success');
    navigate('store', sid);
  } catch(e){
    toast('Error: '+e.message,'error');
  }
}

async function confirmarMovimiento(movId, tipo, pid, cantidad, destinoId){
  if(!confirm('Confirmar este movimiento? Se actualizará el stock.')) return;
  try {
    const batch = db.batch();
    // Update movimiento as confirmed
    batch.update(db.collection('movimientos').doc(movId), {
      confirmado: true, confirmadoEn: new Date().toISOString(), confirmadoPor: S.profile?.nombre||'Admin'
    });
    // Update stock
    const inc = firebase.firestore.FieldValue.increment;
    if(tipo==='entrada'){
      batch.update(db.collection('products').doc(pid), {stock: inc(cantidad)});
    } else {
      batch.update(db.collection('products').doc(pid), {stock: inc(-cantidad)});
      // If traslado, add stock to destination
      if(destinoId){
        // Find same product in destination store
        const destProd = Object.values(S.products).find(p=>p.storeId===destinoId && p.id===pid);
        if(destProd) batch.update(db.collection('products').doc(destProd.id), {stock: inc(cantidad)});
      }
    }
    await batch.commit();
    toast('Movimiento confirmado y stock actualizado','success');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rechazarMovimiento(movId){
  if(!confirm('Rechazar este movimiento? No se actualizará el stock.')) return;
  try {
    await db.collection('movimientos').doc(movId).update({
      confirmado: true, rechazado: true, confirmadoEn: new Date().toISOString()
    });
    toast('Movimiento rechazado','success');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

        <i class="fas fa-check"></i> Guardar conteo
      </button>

  </div>`;
}

async function guardarConteoFisico(sid){
  const prods = Object.values(S.products).filter(p=>p.storeId===sid);
  const cambios = [];
  
  prods.forEach(p=>{
    const input = document.getElementById('cnt-'+p.id);
    if(!input) return;
    const nuevoStock = parseInt(input.value)||0;
    if(nuevoStock !== p.stock){
      cambios.push({id:p.id, nombre:p.nombre, talla:p.talla||'-', stockAnterior:p.stock, stockNuevo:nuevoStock});
    }
  });
  
  if(!cambios.length){
    toast('No hay cambios que guardar','info');
    return;
  }
  
  const resumen = cambios.map(c=>`${c.nombre} (${c.talla}): ${c.stockAnterior} → ${c.stockNuevo}`).join('\n');
  if(!confirm('Se actualizarán '+cambios.length+' producto(s):\n\n'+resumen+'\n\n¿Confirmar conteo?')) return;
  
  try {
    const batch = db.batch();
    cambios.forEach(c=>{
      batch.update(db.collection('products').doc(c.id), {stock: c.stockNuevo});
    });
    await batch.commit();
    toast('Conteo guardado — '+cambios.length+' producto(s) actualizados ✓','success');
    navigate('store', sid);
  } catch(e){
    toast('Error: '+e.message,'error');
  }
}

function buildCierreCaja(sid){
  const s = S.stores[sid];
  if(!s) return '<div style="padding:40px">Punto no encontrado</div>';
  
  const hoy = today();
  const ventasHoy = S.ventas.filter(v => v.storeId === sid && v.fecha === hoy);
  const gastosHoy = S.gastos.filter(g => g.storeId === sid && g.fecha === hoy);
  
  // Calcular efectivo
  const efectivoVentas = ventasHoy.filter(v => (v.medioPago||'Efectivo')==='Efectivo').reduce((s,v)=>s+v.precio*v.cant,0);
  const totalGastos = gastosHoy.reduce((s,g)=>s+g.monto,0);
  
  // Base de caja guardada
  const baseCajaKey = 'basecaja_' + sid + '_' + getWeekDates()[0];
  const baseCaja = parseFloat(localStorage.getItem(baseCajaKey)) || 0;
  
  // Restar retiros confirmados de la semana actual
  const weekDatesCierre = getWeekDates();
  const retirosConfirmados = S.cierres
    .filter(c => c.storeId === sid && c.confirmado && c.montoConfirmado && weekDatesCierre.includes(c.fecha))
    .reduce((s,c) => s + c.montoConfirmado, 0);
  
  const efectivoEntregar = Math.max(0, efectivoVentas - totalGastos - retirosConfirmados);
  const efectivoCaja = Math.max(0, baseCaja + efectivoVentas - totalGastos - retirosConfirmados);
  
  // Ventas por metodo
  const METODOS_LOCAL = ['Efectivo','Nequi','Bancolombia','Daviplata','Tarjeta débito','Tarjeta crédito','Transferencia'];
  const ventasPorMetodo = {};
  METODOS_LOCAL.forEach(m => ventasPorMetodo[m] = 0);
  ventasHoy.forEach(v => {
    const mp = v.medioPago||'Efectivo';
    if(ventasPorMetodo[mp] !== undefined) ventasPorMetodo[mp] += v.precio*v.cant;
  });
  
  // Verificar si ya hay cierre hoy
  const cierreHoy = S.cierres.find(c => c.storeId===sid && c.fecha===hoy && !c.confirmado);
  
  return `
  <div class="dx-header">
    <div class="dx-eyebrow">Amadamia · ${esc(s.name)}</div>
    <h1 style="font-size:1.5rem;letter-spacing:-.03em">Cierre de caja</h1>
    <p style="font-size:.85rem;color:var(--text-2);margin-top:4px">${hoy}</p>
  </div>

  ${cierreHoy ? `
  <div style="background:#fff3da;border:1px solid #f39c12;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px">
    <i class="fas fa-clock" style="color:#f39c12;font-size:1.2rem"></i>
    <div>
      <strong>Ya realizaste el cierre de hoy</strong>
      <div style="font-size:.82rem;color:var(--text-2)">Esperando confirmación de la administradora. Monto declarado: ${COP(cierreHoy.montoDeclarado)}</div>
    </div>
  </div>` : ''}

  <!-- Resumen del dia -->
  <div class="kpi-grid" style="margin-bottom:20px">
    <div class="kpi-card" style="--kc:var(--success)">
      <div class="kc-icon" style="background:var(--success-light);color:#0a6640"><i class="fas fa-chart-line"></i></div>

async function registrarCierre(sid, montoSugerido, baseCaja){
  const monto = parseFloat(document.getElementById('cierre-monto')?.value) || 0;
  const nota = document.getElementById('cierre-nota')?.value || '';
  if(!confirm('Confirmas que vas a entregar ' + COP(monto) + ' a la administradora?')) return;
  try {
    await db.collection('cierres').add({
      storeId: sid,
      fecha: today(),
      montoDeclarado: monto,
      baseCaja: baseCaja,
      nota: nota,
      asesor: S.profile?.nombre || '',
      confirmado: false,
      montoConfirmado: null,
      creadoEn: new Date().toISOString()
    });
    toast('Cierre registrado. Esperando confirmación de la administradora.', 'success');
    navigate('store', sid);
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

async function confirmarCierre(cierreId, montoDeclarado){
  const input = window.prompt('Monto real recibido en pesos ($)\nEl asesor declaro: ' + COP(montoDeclarado), String(montoDeclarado));
  if(input === null) return;
  const montoReal = parseFloat(input.replace(/[^0-9.]/g,''));
  if(isNaN(montoReal) || montoReal < 0){ toast('Monto invalido','error'); return; }
  try {
    await db.collection('cierres').doc(cierreId).update({
      confirmado: true,
      montoConfirmado: montoReal,
      confirmadoEn: new Date().toISOString(),
      confirmadoPor: S.profile?.nombre || 'Admin'
    });
    const diff = montoReal - montoDeclarado;
    if(diff !== 0){
      toast('Confirmado. Diferencia: ' + COP(diff), diff < 0 ? 'error' : 'success');
    } else {
      toast('Cierre confirmado correctamente', 'success');
    }
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

function getWeekDates() {
  const now = new Date();
  const day = now.getDay(); // 0=dom, 1=lun...
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}

const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const METODOS = ['Efectivo','Nequi','Bancolombia','Daviplata','Tarjeta débito','Tarjeta crédito','Transferencia'];
const METODO_ICONS = {'Efectivo':'💵','Nequi':'📱','Bancolombia':'🏦','Daviplata':'📲','Tarjeta débito':'💳','Tarjeta crédito':'💳','Transferencia':'🔄'};

function buildFinanzasSemanales(sid) {
  const s = S.stores[sid];
  if (!s) return '<div style="padding:40px;text-align:center;color:var(--text-3)">Punto no encontrado</div>';
  const weekDates = getWeekDates();
  // Filtrar por periodo seleccionado
  const periodo = isAdmin() ? (S.finPeriodo || 'semana') : 'semana';
  function matchPeriodo(fecha){
    if(periodo === 'dia') return fecha === (S.finDia || today());
    if(periodo === 'mes') return fecha.startsWith(S.finMes || today().slice(0,7));
    if(periodo === 'anio') return fecha.startsWith(String(S.finAnio || new Date().getFullYear()));
    return weekDates.includes(fecha); // semana
  }
  const ventas = S.ventas.filter(v => v.storeId === sid && matchPeriodo(v.fecha));
  const gastos = S.gastos.filter(g => g.storeId === sid && matchPeriodo(g.fecha));

  // Calcular ingresos por dia y metodo
  const ingresosDia = {};
  weekDates.forEach(d => { ingresosDia[d] = {}; METODOS.forEach(m => ingresosDia[d][m] = 0); });
  ventas.forEach(v => {
    const mp = v.medioPago || 'Efectivo';
    if(!ingresosDia[v.fecha]){ ingresosDia[v.fecha]={}; METODOS.forEach(m=>ingresosDia[v.fecha][m]=0); }
    if(METODOS.includes(mp)) ingresosDia[v.fecha][mp] += v.precio * v.cant;
    else ingresosDia[v.fecha]['Efectivo'] += v.precio * v.cant;
  });

  // Total directo de ventas filtradas por periodo (correcto para dia/mes/anio)
  const totalSemana = ventas.reduce((s, v) => s + v.precio * v.cant, 0);

  // Totales por metodo
  const totalMetodo = {};
  METODOS.forEach(m => { totalMetodo[m] = ventas.filter(v=>(v.medioPago||'Efectivo')===m).reduce((s,v)=>s+v.precio*v.cant,0); });

  // Gastos semana
  const totalGastos = gastos.reduce((s, g) => s + g.monto, 0);
  const gastosCat = {};
  gastos.forEach(g => { gastosCat[g.cat] = (gastosCat[g.cat] || 0) + g.monto; });

  // Efectivo disponible
  const efectivoEntradas = ventas.filter(v => (v.medioPago||'Efectivo') === 'Efectivo').reduce((s, v) => s + v.precio * v.cant, 0);
  const efectivoGastos = gastos.reduce((s, g) => s + g.monto, 0);
  // Restar retiros confirmados del periodo
  const retirosDelPeriodo = S.cierres
    .filter(c => c.storeId === sid && c.confirmado && matchPeriodo && matchPeriodo(c.fecha))
    .reduce((s,c) => s + (c.montoConfirmado||0), 0);

  // Utilidad semana
  const costosVentas = ventas.reduce((s, v) => {
    const prod = S.products[v.pid];
    const costoReal = prod ? prod.costo : v.costo;
    return s + costoReal * v.cant;
  }, 0);
  const utilidad = totalSemana - costosVentas - totalGastos;

  // Para periodo dia, usar solo ese dia
  const displayDates = periodo === 'dia' ? [S.finDia||today()] :
                       periodo === 'mes' ? [] : // Se omite tabla diaria para mes/anio
                       periodo === 'anio' ? [] :
                       weekDates;
  const DIAS_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  // Tabla de ingresos por dia
  const ingresosRows = displayDates.map((d, i) => {
    const diaData = ingresosDia[d] || {};
    const total = METODOS.reduce((s,m)=>s+(diaData[m]||0),0);
    const metodosCols = METODOS.map(m => `<td class="td-mono" style="text-align:center;font-size:.78rem">${(diaData[m]||0) > 0 ? COP(diaData[m]) : '<span style="color:var(--text-3)">—</span>'}</td>`).join('');
    const diaNombre = periodo==='dia' ? d : (DIAS[weekDates.indexOf(d)] || d);
    return `<tr style="${total > 0 ? 'background:rgba(60,203,138,.04)' : ''}">
      <td style="font-weight:600;font-size:.85rem;padding:10px 14px">${diaNombre}<br><span style="font-size:.7rem;color:var(--text-3);font-family:JetBrains Mono,monospace">${d}</span></td>
      ${metodosCols}
      <td class="td-mono" style="text-align:right;font-weight:700;color:${total > 0 ? 'var(--success)' : 'var(--text-3)'}">${total > 0 ? COP(total) : '—'}</td>
    </tr>`;
  }).join('');

  const metodoHeaders = METODOS.map(m => `<th style="text-align:center">${METODO_ICONS[m]} ${m}</th>`).join('');
  const metodoTotales = METODOS.map(m => `<td class="td-mono" style="text-align:center;font-size:.78rem;font-weight:700">${totalMetodo[m] > 0 ? COP(totalMetodo[m]) : '—'}</td>`).join('');

  // Gastos rows
  const gastosRows = gastos.length ? gastos.map(g => `<tr>
    <td class="td-mono" style="font-size:.8rem">${g.fecha}</td>
    <td style="font-weight:600;font-size:.85rem">${esc(g.desc)}</td>
    <td><span class="badge sky">${esc(g.cat)}</span></td>
    <td class="td-mono neg">${COP(g.monto)}</td>
    <td><button class="icon-btn danger" onclick="eliminarGasto('${esc(g.id)}')"><i class="fas fa-trash"></i></button></td>
  </tr>`).join('') : `<tr><td colspan="5" class="td-empty" style="padding:20px"><i class="fas fa-receipt"></i>Sin gastos esta semana</td></tr>`;

  // Cargar base de caja guardada
  const baseCajaKey = 'basecaja_' + sid + '_' + weekDates[0];
  const baseCajaGuardada = parseFloat(localStorage.getItem(baseCajaKey)) || 0;
  const efectivoTotal = baseCajaGuardada + efectivoEntradas - efectivoGastos - retirosDelPeriodo;

  return `
  <div class="dx-header">
    <div class="dx-eyebrow">Amadamia · ${esc(s.name)}</div>
    <h1 style="font-size:1.5rem;letter-spacing:-.03em">Finanzas</h1>
  </div>

  <!-- Selector de periodo - solo admin -->
  ${isAdmin()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn ${S.finPeriodo==='dia'?'btn-primary':''}" onclick="S.finPeriodo='dia';navigate('finanzas','${sid}')">
      <i class="fas fa-calendar-day"></i> Por dia
    </button>
    <button class="btn ${!S.finPeriodo||S.finPeriodo==='semana'?'btn-primary':''}" onclick="S.finPeriodo='semana';navigate('finanzas','${sid}')">
      <i class="fas fa-calendar-week"></i> Por semana
    </button>
    <button class="btn ${S.finPeriodo==='mes'?'btn-primary':''}" onclick="S.finPeriodo='mes';navigate('finanzas','${sid}')">
      <i class="fas fa-calendar-alt"></i> Por mes
    </button>
    <button class="btn ${S.finPeriodo==='anio'?'btn-primary':''}" onclick="S.finPeriodo='anio';navigate('finanzas','${sid}')">

async function guardarEditarPunto(sid){
  const nombre = document.getElementById('st-edit-n')?.value?.trim();
  const loc = document.getElementById('st-edit-loc')?.value?.trim();
  const c = document.querySelector('input[name="stc-edit"]:checked');
  const color = c ? c.value : (typeof STORE_COLORS !== 'undefined' ? STORE_COLORS[0] : '#6c63ff');
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  try {
    await db.collection('stores').doc(sid).update({name:nombre, location:loc||'—', color});
    toast('Punto actualizado ✓','success');
    navigate('home');
  } catch(e){
    toast('Error: '+e.message,'error');
  }
}
