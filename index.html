async function eliminarEstaTalla(pid, sid){
  const p = S.products[pid];
  if(!p) return;
  if(!confirm('Eliminar talla "' + (p.talla||'-') + '" de "' + p.nombre + '"?\nEsta accion no se puede deshacer.')) return;
  try {
    await db.collection('products').doc(pid).delete();
    toast('Talla eliminada correctamente', 'success');
    navigate('store', sid);
  } catch(e){
    toast('Error: ' + e.message, 'error');
  }
}

async function guardarProductoDirecto(sid, pid){
  const nombre=document.getElementById('p-n')?.value?.trim();
  const cat=document.getElementById('p-c')?.value;
  const talla=document.getElementById('p-t')?.value?.trim();
  const costo=parseFloat(document.getElementById('p-co')?.value)||0;
  const stock=parseInt(document.getElementById('p-s')?.value)||0;
  const precioDetal=parseFloat(document.getElementById('p-d')?.value)||0;
  const precioMayor=parseFloat(document.getElementById('p-m')?.value)||0;
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  if(!precioDetal){toast('Ingresa el precio detal','error');return;}
  // Si es empleada, preservar el costo original
  const costoFinal = isAdmin() ? costo : (S.products[pid]?.costo || 0);
  const fechaIngreso=document.getElementById('p-fecha')?.value||today();
  const data={nombre,cat,talla,costo:costoFinal,precioDetal,precioMayor,stock,storeId:sid,fechaIngreso};
  
  // Si es nuevo producto, verificar si ya existe uno con mismo nombre y talla
  if(!pid){
    const existente = Object.values(S.products).find(p => 
      p.storeId===sid && 
      p.nombre.trim().toUpperCase()===nombre.trim().toUpperCase() && 
      (p.talla||'').trim().toUpperCase()===(talla||'').trim().toUpperCase()
    );
    if(existente){
      const nuevoStock = existente.stock + stock;
      if(!confirm('Ya existe "'+nombre+'" talla "'+talla+'" con '+existente.stock+' unidades.\n¿Sumar '+stock+' unidades? → Nuevo total: '+nuevoStock)) return;
      await db.collection('products').doc(existente.id).update({
        stock: nuevoStock,
        fechaIngreso: fechaIngreso,
        costo: costoFinal,
        precioDetal, precioMayor
      });
      toast('Stock actualizado: '+nuevoStock+' unidades ✓','success');
      navigate('store', sid);
      return;
    }
  }

  if(pid&&S.products[pid]){
    await db.collection('products').doc(pid).update(data);
    toast('Producto actualizado ✓','success');
  } else {
    data.createdAt=new Date().toISOString();
    await db.collection('products').add(data);
    toast('Producto agregado ✓','success');
  }
  navigate('store',sid);
}

function buscarProducto(query, sid){
  const prods = Object.values(S.products).filter(p => p.storeId === sid);
  const dd = document.getElementById('v-p-dropdown');
  if(!dd) return;
  
  // Agrupar por nombre
  const grupos = {};
  prods.forEach(p => {
    const key = p.nombre.trim().toUpperCase();
    if(!grupos[key]) grupos[key] = {nombre:p.nombre, cat:p.cat, items:[]};
    grupos[key].items.push(p);
  });
  
  const q = query.toLowerCase();
  const filtrados = Object.values(grupos).filter(g => !q || g.nombre.toLowerCase().includes(q));
  
  if(!filtrados.length){ dd.style.display='none'; return; }
  dd.style.display='block';
  dd.innerHTML = filtrados.map((g,gi) => {
    const stockTotal = g.items.reduce((s,p)=>s+p.stock,0);
    const tallasText = g.items.map(p=>p.talla||'-').join(', ');
    return '<div id="dd-item-'+gi+'" data-sid="'+sid+'" data-nombre="'+encodeURIComponent(g.nombre)+'"'+
      ' style="padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee">' +
      '<div>' +
        '<div style="font-weight:600;font-size:.88rem">'+catIcon(g.cat)+' '+esc(g.nombre)+'</div>'+
        '<div style="font-size:.72rem;color:#999">Tallas: '+tallasText+'</div>'+
      '</div>'+
      '<span style="font-size:.65rem;padding:2px 8px;border-radius:8px;background:'+(stockTotal<=3?'#fee':'#efe')+';color:'+(stockTotal<=3?'#c00':'#080')+'">'+stockTotal+'</span>'+
    '</div>';
  }).join('');
  // Add click handlers
  filtrados.forEach((g,gi) => {
    const el = document.getElementById('dd-item-'+gi);
    if(el){
      el.addEventListener('mouseenter',function(){this.style.background='#f5f3ff';});
      el.addEventListener('mouseleave',function(){this.style.background='';});
      el.addEventListener('click',function(){elegirReferencia(this.dataset.sid, this.dataset.nombre);});
    }
  });
}

function elegirReferencia(sid, nombreEncoded){
  const nombre = decodeURIComponent(nombreEncoded);
  document.getElementById('v-p-search').value = nombre;
  document.getElementById('v-p-dropdown').style.display = 'none';
  
  // Mostrar tallas disponibles
  const prods = Object.values(S.products).filter(p => p.storeId === sid && p.nombre.trim().toUpperCase() === nombre.trim().toUpperCase());
  const wrap = document.getElementById('v-tallas-wrap');
  if(!wrap) return;
  
  wrap.innerHTML = prods.map((p,pi) => {
    const tc = tallaColor(p.talla);
    const bc = p.stock===0?'#e74c3c':p.stock<=3?'#f39c12':'#27ae60';
    return '<button type="button" id="talla-btn-'+pi+'" data-sid="'+sid+'" data-pid="'+p.id+'" data-stock="'+p.stock+'"'+
      ' style="border:2px solid '+tc+'60;background:'+tc+'15;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit">' +
      '<div style="font-weight:700;color:'+tc+';font-size:.9rem">'+esc(p.talla||'-')+'</div>'+
      '<div style="font-size:.65rem;font-family:JetBrains Mono,monospace;color:'+bc+'">Stock: '+p.stock+'</div>'+
    '</button>';
  }).join('');
  // Add click handlers for talla buttons
  prods.forEach((p,pi) => {
    const btn = document.getElementById('talla-btn-'+pi);
    if(btn) btn.addEventListener('click', function(){
      elegirTalla(this.dataset.sid, this.dataset.pid, parseInt(this.dataset.stock));
    });
  });
  
  // Clear selection
  document.getElementById('v-p').value = '';
  document.getElementById('v-p-info').innerHTML = '';
  actualizarPrecios(sid);
}

function elegirTalla(sid, pid, stock){
  // Mark selected talla button
  const wrap = document.getElementById('v-tallas-wrap');
  if(wrap) wrap.querySelectorAll('button').forEach(b => b.style.outline='none');
  
  document.getElementById('v-p').value = pid;
  const p = S.products[pid];
  document.getElementById('v-p-info').innerHTML = 
    '<span class="badge '+(stock<=3?'danger':'success')+'" style="font-size:.7rem">Talla '+esc(p?.talla||'-')+' · Stock disponible: '+stock+'</span>';
  actualizarPrecios(sid);
}

function elegirProducto(sid, pid, nombre, stock){
  document.getElementById('v-p').value = pid;
  document.getElementById('v-p-search').value = nombre;
  document.getElementById('v-p-dropdown').style.display = 'none';
  actualizarPrecios(sid);
}

function actualizarPrecios(sid){
  const pid=document.getElementById('v-p')?.value;
  const tipo=document.getElementById('v-t')?.value||'detal';
  const cant=parseInt(document.getElementById('v-c')?.value)||1;
  const p=S.products[pid]; if(!p)return;
  const precio=tipo==='mayor'?p.precioMayor:p.precioDetal;
  const util=(precio-p.costo)*cant;
  const sp=document.getElementById('vsp'),st=document.getElementById('vst'),su=document.getElementById('vsu');
  if(sp)sp.textContent=COP(precio);
  if(st)st.textContent=COP(precio*cant);
  if(su){su.textContent=COP(util);su.style.color=util>=0?'var(--success)':'var(--danger)';}
}

async function guardarVentaDirecto(sid){
  const pid=document.getElementById('v-p')?.value;
  const tipo=document.getElementById('v-t')?.value;
  const cant=parseInt(document.getElementById('v-c')?.value)||1;
  const fecha=document.getElementById('v-f')?.value||today();
  const nota=document.getElementById('v-n')?.value||'';
  const medioPago=document.getElementById('v-mp')?.value||'Efectivo';
  const clienteNombre=document.getElementById('v-cli-nombre')?.value?.trim()||'';
  const clienteTel=document.getElementById('v-cli-tel')?.value?.trim()||'';
  const p=S.products[pid];
  if(!p){toast('Producto no encontrado','error');return;}
  const vaAfectar = isAdmin() ? (document.getElementById('v-afectar-inv')?.value !== 'no') : true;
  if(vaAfectar && p.stock<cant){toast('Stock insuficiente. Disponible: '+p.stock,'error');return;}
  const precio=tipo==='mayor'?p.precioMayor:p.precioDetal;
  const afectarInv = isAdmin() ? (document.getElementById('v-afectar-inv')?.value !== 'no') : true;
  const batch=db.batch();
  const vref=db.collection('ventas').doc();
  batch.set(vref,{storeId:sid,pid,nombre:p.nombre,cant,precio,costo:p.costo,tipo,fecha,nota,medioPago,clienteNombre,clienteTel,afectarInv,creadoPor:S.profile?.nombre||'',createdAt:new Date().toISOString()});
  if(afectarInv){
    batch.update(db.collection('products').doc(pid),{stock:firebase.firestore.FieldValue.increment(-cant)});
  }
  await batch.commit();
  toast('Venta registrada ✓','success');
  navigate('store',sid);
}

async function crearEmpleada(){
  const nombre=document.getElementById('u-n')?.value.trim();
  const email=document.getElementById('u-e')?.value.trim();
  const pass=document.getElementById('u-p')?.value;
  const storeId=document.getElementById('u-s')?.value;

  if(pass.length<6){toast('La contraseña debe tener al menos 6 caracteres','error');return;}
  try{
    const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});
    const data=await res.json();
    if(data.error){toast(data.error.message,'error');return;}
    await db.collection('users').doc(data.localId).set({nombre,rol:'empleada',storeId,email});
    toast(`Empleada ${nombre} creada ✓`,'success');
    ['u-n','u-e','u-p'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  }catch(e){toast('Error: '+e.message,'error');}
}

let _invVerTodo = false;

function toggleVerTodo(){
  _invVerTodo = !_invVerTodo;
  const wrap = document.getElementById('inv-tabla-wrap');
  const placeholder = document.getElementById('inv-placeholder');
  const info = document.getElementById('inv-result-info');
  const btnTxt = document.getElementById('btn-ver-todo-txt');
  const rows = document.querySelectorAll('#inv-table-body tr');
  if(_invVerTodo){
    rows.forEach(r => r.style.display = '');
    wrap.style.display = 'block';
    placeholder.style.display = 'none';
    info.textContent = rows.length + ' producto(s) en inventario';
    info.style.color = 'var(--text-2)';
    btnTxt.textContent = 'Ocultar';
    document.getElementById('inv-search').value = '';
  } else {
    wrap.style.display = 'none';
    placeholder.style.display = 'block';
    info.textContent = '';
    btnTxt.textContent = 'Ver todo';
  }
}

function buscarInventario(query, sid){
  const wrap = document.getElementById('inv-tabla-wrap');
  const placeholder = document.getElementById('inv-placeholder');
  const info = document.getElementById('inv-result-info');
  const q = (query || '').toLowerCase().trim();
  
  if(!q){
    if(!_invVerTodo){
      if(wrap) wrap.style.display = 'none';
      if(placeholder) placeholder.style.display = 'block';
      if(info) info.textContent = '';
    }
    return;
  }
  
  // Mostrar tabla al escribir
  if(wrap) wrap.style.display = 'block';
  if(placeholder) placeholder.style.display = 'none';
  _invVerTodo = false;
  const btnTxt = document.getElementById('btn-ver-todo-txt');
  if(btnTxt) btnTxt.textContent = 'Ver todo';
  
  // Filtrar filas
  const rows = document.querySelectorAll('#inv-table-body tr');
  let visible = 0;
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    if(text.includes(q)){
      row.style.display = '';
      visible++;
    } else {
      row.style.display = 'none';
    }
  });
  
  if(info){
    info.textContent = visible > 0 ? visible + ' resultado(s) para "' + query + '"' : 'Sin resultados para "' + query + '"';
    info.style.color = visible > 0 ? 'var(--success)' : 'var(--danger)';
  }
}

async function eliminarTalla(el){

    await db.collection('products').doc(pid).delete();
    toast('Talla '+talla+' eliminada', 'success');
  } catch(e) {
    toast('Error: '+e.message, 'error');
  }
}

async function eliminarReferencia(el){
  var ids = el.getAttribute('data-ids').split(',');
  var nombre = el.getAttribute('data-nombre');
  if(!confirm('Eliminar "'+nombre+'" y todas sus tallas? Esta accion no se puede deshacer.')) return;
  try {
    for(var i=0; i<ids.length; i++){
      await db.collection('products').doc(ids[i]).delete();
    }
    toast('Referencia eliminada', 'success');
  } catch(e) {
    toast('Error al eliminar: '+e.message, 'error');
  }
}

function agregarTallaBtn(el){
  var pid = el.getAttribute('data-pid');
  var nombre = decodeURIComponent(el.getAttribute('data-nombre'));
  var p = S.products[pid];
  if(!p) return;
  S.editPid = null;
  S._nuevaTallaNombre = nombre;
  S.storeId = p.storeId;
  navigate('nuevoproducto', p.storeId);
}
function openModalEditarProducto(pid){const p=S.products[pid];if(p)openModalProducto(p.storeId,p);}
async function guardarProducto(sid,pid){
  const nombre=document.getElementById('p-n').value.trim();
  const cat=document.getElementById('p-c').value;
  const talla=document.getElementById('p-t').value.trim();
  const costo=parseFloat(document.getElementById('p-co').value)||0;
  const stock=parseInt(document.getElementById('p-s').value)||0;
  const precioDetal=parseFloat(document.getElementById('p-d').value)||0;
  const precioMayor=parseFloat(document.getElementById('p-m').value)||0;
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  if(!precioDetal){toast('Ingresa el precio detal','error');return;}
  const data={nombre,cat,talla,costo,precioDetal,precioMayor,stock,storeId:sid};
  if(pid&&S.products[pid]){await db.collection('products').doc(pid).update(data);toast('Actualizado ✓','success');}
  else{data.createdAt=new Date().toISOString();await db.collection('products').add(data);toast('Agregado ✓','success');}
  closeModal();
}
async function eliminarProducto(pid){
  if(!confirm('¿Eliminar este producto?'))return;
  await db.collection('products').doc(pid).delete();toast('Eliminado','info');
}

function openModalVenta(sid){
  const prods=Object.values(S.products).filter(p=>p.storeId===sid);
  if(!prods.length){toast('Primero agrega productos','error');return;}
  openModal(`<div class="modal-box"><h3>💸 Registrar venta</h3><div class="modal-body">
    <div class="form-group"><label>Producto</label><select id="v-p" onchange="actualizarPrecioModal()">
      ${prods.map(p=>`<option value="${esc(p.id)}">${catIcon(p.cat)} ${esc(p.nombre)} — Stock: ${p.stock}</option>`).join('')}
    </select></div>
    <div class="fg c2">
      <div class="form-group"><label>Tipo de venta</label><select id="v-t" onchange="actualizarPrecioModal()">
        <option value="detal">💅 Detal — por unidad</option>
        <option value="mayor">📦 Mayorista — por mayor</option>
      </select></div>
      <div class="form-group"><label>Cantidad</label><input id="v-c" type="number" value="1" min="1" oninput="actualizarPrecioModal()"/></div>
      <div class="form-group"><label>Fecha</label><input id="v-f" type="date" value="${today()}"/></div>
      <div class="form-group"><label>Nota (opcional)</label><input id="v-n" placeholder="Cliente, pedido…"/></div>
    </div>
    <div style="background:var(--bg-soft);border-radius:var(--radius);padding:14px 18px;border:1px solid var(--border)">
      <div class="sr"><span class="sr-lbl">Precio unitario</span><span class="sr-val" id="vsp">—</span></div>
      <div class="sr"><span class="sr-lbl">Total venta</span><span class="sr-val" id="vst">—</span></div>
      ${isAdmin()?'<div class="sr" style="border:none"><span class="sr-lbl">Utilidad estimada</span><span class="sr-val" id="vsu">—</span></div>':''}
    </div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarVenta('${sid}')"><i class="fas fa-check"></i> Registrar</button>
    </div></div>`);
  actualizarPrecioModal();
}
function actualizarPrecioModal(){
  const pid=document.getElementById('v-p')?.value;
  const tipo=document.getElementById('v-t')?.value||'detal';
  const cant=parseInt(document.getElementById('v-c')?.value)||1;
  const p=S.products[pid];if(!p)return;
  const precio=tipo==='mayor'?p.precioMayor:p.precioDetal;
  const util=(precio-p.costo)*cant;
  const sp=document.getElementById('vsp'),st=document.getElementById('vst'),su=document.getElementById('vsu');
  if(sp)sp.textContent=COP(precio);if(st)st.textContent=COP(precio*cant);
  if(su){su.textContent=COP(util);su.style.color=util>=0?'var(--success)':'var(--danger)';}
}
async function guardarVenta(sid){
  const pid=document.getElementById('v-p').value;
  const tipo=document.getElementById('v-t').value;
  const cant=parseInt(document.getElementById('v-c').value)||1;
  const fecha=document.getElementById('v-f').value||today();
  const nota=document.getElementById('v-n')?.value||'';
  const medioPago=document.getElementById('v-mp')?.value||'Efectivo';
  const clienteNombre=document.getElementById('v-cli-nombre')?.value?.trim()||'';
  const clienteTel=document.getElementById('v-cli-tel')?.value?.trim()||'';
  const p=S.products[pid];
  if(!p){toast('Producto no encontrado','error');return;}
  if(p.stock<cant){toast(`Stock insuficiente. Disponible: ${p.stock}`,'error');return;}
  const precio=tipo==='mayor'?p.precioMayor:p.precioDetal;
  const afectarInv = isAdmin() ? (document.getElementById('v-afectar-inv')?.value !== 'no') : true;
  const batch=db.batch();
  const vref=db.collection('ventas').doc();
  batch.set(vref,{storeId:sid,pid,nombre:p.nombre,cant,precio,costo:p.costo,tipo,fecha,nota,medioPago,clienteNombre,clienteTel,afectarInv,creadoPor:S.profile?.nombre||'',createdAt:new Date().toISOString()});
  if(afectarInv){
    batch.update(db.collection('products').doc(pid),{stock:firebase.firestore.FieldValue.increment(-cant)});
  }
  await batch.commit();toast('Venta registrada ✓','success');closeModal();
}
async function eliminarVenta(vid){
  const v=S.ventas.find(x=>x.id===vid);if(!v)return;
  const devuelveStock = v.afectarInv !== false;
  const msg = devuelveStock ? '¿Eliminar esta venta? Se devolverá el stock al inventario.' : '¿Eliminar esta venta? NO se devolverá stock (era venta histórica).';
  if(!confirm(msg))return;
  const batch=db.batch();
  batch.delete(db.collection('ventas').doc(vid));
  if(devuelveStock && S.products[v.pid]){
    batch.update(db.collection('products').doc(v.pid),{stock:firebase.firestore.FieldValue.increment(v.cant)});
  }
  await batch.commit();
  toast(devuelveStock?'Eliminada y stock devuelto':'Eliminada sin afectar stock','info');
}

function openModalGasto(sid){
  openModal(`<div class="modal-box"><h3>🧾 Agregar gasto</h3><div class="modal-body">
    <div class="form-group"><label>Descripción</label><input id="g-d" placeholder="Ej: Arriendo, nómina…"/></div>
    <div class="fg c2">
      <div class="form-group"><label>Categoría</label><select id="g-c">${GASTO_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>Monto ($)</label><input id="g-m" type="number" placeholder="0"/></div>
      <div class="form-group"><label>Fecha</label><input id="g-f" type="date" value="${today()}"/></div>
    </div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarGasto('${sid}')"><i class="fas fa-check"></i> Agregar</button>
    </div></div>`);
}
async function guardarGasto(sid){
  const desc=document.getElementById('g-d').value.trim();
  const cat=document.getElementById('g-c').value;
  const monto=parseFloat(document.getElementById('g-m').value)||0;
  const fecha=document.getElementById('g-f').value||today();
  if(!desc||!monto){toast('Descripción y monto son obligatorios','error');return;}
  await db.collection('gastos').add({storeId:sid,desc,cat,monto,fecha,creadoPor:S.profile?.nombre||'',createdAt:new Date().toISOString()});
  toast('Gasto registrado ✓','success');closeModal();
}
async function eliminarGasto(gid){
  if(!confirm('¿Eliminar este gasto?'))return;
  await db.collection('gastos').doc(gid).delete();toast('Eliminado','info');
}

function confirmLogout(){if(confirm('¿Cerrar sesión?'))doLogout();}
</script>
